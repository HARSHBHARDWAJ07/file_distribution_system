services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=cloudstore
      - POSTGRES_PASSWORD=cloudstore
      - POSTGRES_DB=cloudstore
    ports:
      - "5432:5432"
    volumes:
      - ./apps/auth-service/db/schema.sql:/docker-entrypoint-initdb.d/01-auth-schema.sql
      - ./apps/file-service/db/schema.sql:/docker-entrypoint-initdb.d/02-file-schema.sql
      - ./apps/file-service/db/migration_phase3.sql:/docker-entrypoint-initdb.d/03-file-phase3.sql
      - ./apps/file-service/db/migration_phase4.sql:/docker-entrypoint-initdb.d/04-file-phase4.sql
      - ./apps/file-service/db/migration_phase5.sql:/docker-entrypoint-initdb.d/05-file-phase5.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudstore"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  # MinIO's Docker images now require a paid subscription to pull, so local
  # dev uses LocalStack's S3 emulation instead - same S3-compatible API,
  # same storage.js code path, still free to pull and run.
  s3-mock:
    image: localstack/localstack:3.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=us-east-1
      # LocalStack 3.0's default S3 provider breaks a multipart upload once a
      # part PUT is cut off mid-transfer: the re-sent part comes back with
      # ETag "None" and the upload can never complete. Real S3 and R2 handle
      # it (verified against R2), and so does the older 'v2' provider - which
      # is what the UI's offline/reload/resume paths need to work locally.
      - PROVIDER_OVERRIDE_S3=v2
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health"]
      interval: 2s
      timeout: 2s
      retries: 20

  s3-mock-init:
    image: amazon/aws-cli
    depends_on:
      s3-mock:
        condition: service_healthy
    entrypoint: /bin/sh
    # Same CORS rule production's R2 bucket needs: browsers PUT parts straight
    # to storage and must be allowed to read each part's ETag header.
    command:
      - -c
      - >-
        aws --endpoint-url=http://s3-mock:4566 --region us-east-1 s3 mb s3://cloudstore &&
        aws --endpoint-url=http://s3-mock:4566 --region us-east-1 s3api put-bucket-cors --bucket cloudstore --cors-configuration file:///infra/storage-cors.json
    volumes:
      - ./infra:/infra:ro
    environment:
      - AWS_ACCESS_KEY_ID=localkey
      - AWS_SECRET_ACCESS_KEY=localsecret

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - DATABASE_URL=postgres://cloudstore:cloudstore@postgres:5432/cloudstore
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=local-dev-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  file-service:
    build:
      context: .
      dockerfile: apps/file-service/Dockerfile
    ports:
      - "4002:4002"
    environment:
      - PORT=4002
      - DATABASE_URL=postgres://cloudstore:cloudstore@postgres:5432/cloudstore
      - STORAGE_ENDPOINT=http://s3-mock:4566
      - STORAGE_REGION=us-east-1
      - STORAGE_BUCKET=cloudstore
      - STORAGE_ACCESS_KEY_ID=localkey
      - STORAGE_SECRET_ACCESS_KEY=localsecret
      - STORAGE_PUBLIC_ENDPOINT=http://localhost:4566
      - INTERNAL_API_TOKEN=local-dev-internal-token-change-me
    depends_on:
      postgres:
        condition: service_healthy
      s3-mock-init:
        condition: service_completed_successfully

  # Background worker: no ports - it only consumes the pg-boss queue.
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      - DATABASE_URL=postgres://cloudstore:cloudstore@postgres:5432/cloudstore
      - STORAGE_ENDPOINT=http://s3-mock:4566
      - STORAGE_REGION=us-east-1
      - STORAGE_BUCKET=cloudstore
      - STORAGE_ACCESS_KEY_ID=localkey
      - STORAGE_SECRET_ACCESS_KEY=localsecret
    depends_on:
      postgres:
        condition: service_healthy
      s3-mock-init:
        condition: service_completed_successfully

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - AUTH_SERVICE_URL=http://auth-service:4001
      - FILE_SERVICE_URL=http://file-service:4002
      - JWT_SECRET=local-dev-secret-change-me
      - INTERNAL_API_TOKEN=local-dev-internal-token-change-me
      - REDIS_URL=redis://redis:6379
      - ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      - auth-service
      - file-service
