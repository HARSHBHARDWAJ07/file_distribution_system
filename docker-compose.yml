services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=cloudstore
      - POSTGRES_PASSWORD=cloudstore
      - POSTGRES_DB=cloudstore
    ports:
      - "5432:5432"
    volumes:
      - ./apps/auth-service/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudstore"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - DATABASE_URL=postgres://cloudstore:cloudstore@postgres:5432/cloudstore
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=local-dev-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - AUTH_SERVICE_URL=http://auth-service:4001
      - JWT_SECRET=local-dev-secret-change-me
    depends_on:
      - auth-service
