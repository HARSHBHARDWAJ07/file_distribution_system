name: Worker keep-alive
# The worker runs as a free Render Web Service, which sleeps after ~15 min with
# no inbound traffic - and a sleeping worker drains no queue. Pinging /health
# every 10 min keeps it awake. Note: this uses nearly all of the workspace's
# free instance hours, and GitHub may delay scheduled runs under load.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping worker /health
        run: curl -fsS --retry 3 --retry-delay 15 --retry-all-errors --max-time 90 "${{ vars.WORKER_HEALTH_URL }}"
